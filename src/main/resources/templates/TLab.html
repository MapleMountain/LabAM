<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            z-index: 1000;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .modal h2 {
            margin-top: 0;
            color: #333;
        }

        .modal label, .modal input, .modal select {
            display: block;
            width: 100%;
            margin-bottom: 10px;
        }

        .modal input, .modal select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .modal button {
            width: auto;
            margin-right: 10px;
        }
    </style>
</head>
<body>
<h1>分配的实验室</h1>
<table border="1">
    <thead>
    <tr>
        <th>实验室id</th>
        <th>实验室名</th>
        <th>管理员id</th>
        <th>用户名</th>

    </tr>
    </thead>
    <tbody>
    <tr th:each="l : ${list}">
        <td th:text="${l.labId}">实验室id</td>
        <td th:text="${l.labName}">实验室名</td>
        <td th:text="${l.managerId}">管理员id</td>
        <td th:text="${l.username}">用户名</td>

    </tr>
    </tbody>
</table>
</body>
</html>
