<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* 自定义样式 */
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 20px;
        }
        .card {
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: #fff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .card-title {
            margin-bottom: 0;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }
        .table thead th {
            background-color: #007bff;
            color: #fff;
        }
        .modal-content {
            border-radius: 10px;
        }
        .modal-header {
            background-color: #007bff;
            color: #fff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .modal-header h5 {
            margin: 0;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title">用户信息</h1>
                </div>
                <div class="card-body">
                    <p class="card-text"><strong>用户id:</strong> <span th:text="${user.userId}"></span></p>
                    <p class="card-text"><strong>用户名:</strong> <span th:text="${user.username}"></span></p>
                    <p class="card-text"><strong>角色:</strong> <span th:text="${user.role}"></span></p>
                    <p class="card-text"><strong>学院id:</strong> <span th:text="${user.collegeId}"></span></p>
                    <p class="card-text"><strong>学院:</strong> <span th:text="${user.collegeName}"></span></p>
                </div>
                <div class="card-footer text-right">
                    <button onclick="window.parent.loadPage('userList')" class="btn btn-primary">回到用户列表</button>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h1 class="card-title">分配的实验室列表</h1>
                    <button class="btn btn-primary" id="assignButton">分配实验室</button>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>管理员id</th>
                            <th>实验室id</th>
                            <th>用户名</th>
                            <th>实验室名称</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="labManagersTableBody">
                        <!-- 数据将通过jQuery填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="assignModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">分配实验室</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Lab ID</th>
                        <th>status</th>
                        <th>Lab Name</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="labListTableBody">
                    <!-- 实验室数据将通过jQuery填充 -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/jquery-3.7.1.min.js}" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}" src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {
        const uid = [[${user.userId}]];
        const token = localStorage.getItem('token');
        loadList();

        function loadList() {
            $.ajax({
                url: '/getManagers?uid=' + uid,
                type: 'GET',
                beforeSend: function (request) {
                    request.setRequestHeader("token", token);
                },
                success: function (response) {
                    var managersList = response.data; // 假设返回的数据格式为 { data: [...] }
                    var tableBody = $('#labManagersTableBody');
                    tableBody.empty();
                    managersList.forEach(function (manager) {
                        var row = `
                            <tr>
                                <td>${manager.managerId}</td>
                                <td>${manager.labId}</td>
                                <td>${manager.username}</td>
                                <td>${manager.labName}</td>
                                <td><button class="btn btn-danger btn-sm" onclick="unassign(${manager.id})">移除实验室授权</button></td>
                            </tr>
                        `;
                        tableBody.append(row);
                    });
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching data:', error);
                }
            });
        }

        function unassign(id) {
            if (confirm('确定要删除吗？')) {
                $.ajax({
                    url: '/unassign',
                    type: 'DELETE',
                    data: { id: id },
                    beforeSend: function(request) {
                        request.setRequestHeader("token", token);
                    },
                    success: function(response) {
                        if (response.code === 0) {
                            alert('删除成功');
                            loadList();
                        } else {
                            alert('删除失败: ' + response.message);
                        }
                    },
                    error: function(error) {
                        console.error('删除时发生错误:', error);
                        alert('删除失败');
                    }
                });
            }
        }

        function loadLabList() {
            $.ajax({
                url: '/getLabList',
                type: 'GET',
                beforeSend: function (request) {
                    request.setRequestHeader("token", token);
                },
                success: function (response) {
                    var labList = response.data; // 假设返回的数据格式为 { data: [...] }
                    var tableBody = $('#labListTableBody');
                    tableBody.empty();
                    labList.forEach(function (lab) {
                        var row = `
                            <tr>
                                <td>${lab.labId}</td>
                                <td>${lab.status}</td>
                                <td>${lab.labName}</td>
                                <td><button class="btn btn-success btn-sm" onclick="assignLab(${lab.labId})">分配</button></td>
                            </tr>
                        `;
                        tableBody.append(row);
                    });
                    $('#assignModal').modal('show');
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching lab list:', error);
                }
            });
        }

        function assignLab(labId) {
            $.ajax({
                url: '/assign',
                type: 'POST',
                data: {
                    managerId: uid,
                    labId: labId
                },
                beforeSend: function (request) {
                    request.setRequestHeader("token", token);
                },
                success: function (response) {
                    if (response.code === 0) {
                        alert('分配成功');
                        loadList();
                        $('#assignModal').modal('hide');
                    } else {
                        alert('分配失败: ' + response.message);
                    }
                },
                error: function (error) {
                    console.error('分配时发生错误:', error);
                    alert('分配失败');
                }
            });
        }

        $('#assignButton').click(function() {
            loadLabList();
        });

        window.unassign = unassign;
        window.assignLab = assignLab;
    });
</script>
</body>
</html>
